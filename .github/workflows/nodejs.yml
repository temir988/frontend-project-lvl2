# Name of workflow
name: Lint and tests

# Trigger the workflow on push or pull request
on:
  - push
  - pull_request

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: install deps
        run: |
          npm install
        env:
          CI: true
      - name: Run formatter
        run: |
          npm run fmt:check
      - name: Run linter
        run: |
          npm run lint
      - name: Test & publish code coverage
        run: |
          npm run coverage
